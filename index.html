<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Equipos Aleatorios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎲 Generador de Equipos Aleatorios</h1>

        <!-- Sección de entrada -->
        <div class="input-section">
            <h2>Lista de Personas</h2>
            <div class="add-person">
                <input type="text" id="personInput" placeholder="Nombre de la persona" />
                <select id="roleSelect">
                    <option value="Técnico">Técnico</option>
                    <option value="Funcional">Funcional</option>
                </select>
                <button id="addPersonBtn">➕ Agregar</button>
            </div>

            <div class="file-info-section">
                <span id="fileInfo" class="file-info"></span>
            </div>

            <div class="limit-section">
                <label for="limitInput">Límite total:</label>
                <input type="number" id="limitInput" min="1" value="5" />

                <label for="techLimitInput">Límite técnicos:</label>
                <input type="number" id="techLimitInput" min="0" value="3" />

                <label for="funcLimitInput">Límite funcionales:</label>
                <input type="number" id="funcLimitInput" min="0" value="2" />
            </div>

            <div class="people-list">
                <h3>Personas disponibles:</h3>
                <ul id="peopleList"></ul>
            </div>

            <button id="generateBtn" class="generate-btn">🎯 Generar Equipo Aleatorio</button>
        </div>

        <!-- Sección de resultados -->
        <div class="result-section">
            <h2>Equipo Generado</h2>
            <div id="resultMessage" class="result-message"></div>
            <ul id="resultList"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
